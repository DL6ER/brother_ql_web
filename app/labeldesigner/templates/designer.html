<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15171a">
    <title>Label Designer</title>
    <!-- Installed as an app (home screen, desktop) -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/app/apple-touch-icon.png') }}">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Labels">
    <script>
        // Set the theme before the page is drawn, so that it does not flash
        (function () {
            let mode = null;
            try { mode = localStorage.getItem('designer_theme'); } catch (e) { }
            if (mode === 'dark' || mode === 'light') document.documentElement.setAttribute('data-theme', mode);
        })();
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/favicon/android-icon-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon/favicon-16x16.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='designer/designer.css') }}?v={{ version }}">
</head>
<body>
    <header class="top">
        <div class="brand">
            <a class="logo" href="#edit"><span class="mark"><i class="fa-solid fa-tag"></i></span><span>Labels</span></a>
            {% if build.release %}<a class="build" id="buildInfo" href="https://github.com/DL6ER/labelhaus/releases/tag/{{ build.release }}" target="_blank" rel="noopener"
                title="Release {{ build.release }}{% if build.commit %}, commit {{ build.commit }}{% endif %}{% if build.date %}, built {{ build.date }}{% endif %}">{{ build.release }}{% if build.date %}, {{ build.date }}{% endif %}</a>
            {%- elif build.commit %}<a class="build" id="buildInfo" href="https://github.com/DL6ER/labelhaus/commit/{{ build.commit }}" target="_blank" rel="noopener"
                title="Commit {{ build.commit }}{% if build.date %}, built {{ build.date }}{% endif %}">{{ build.commit[:7] }}{% if build.date %}, {{ build.date }}{% endif %}</a>
            {%- elif build.date %}<span class="build" id="buildInfo" title="Build time">{{ build.date }}</span>{% endif %}
        </div>
        <nav class="tabs" id="tabs">
            <a href="#edit" data-tab="edit"><i class="fa-solid fa-pen-ruler"></i><span>Editor</span></a>
            <a href="#wizard" data-tab="wizard"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Wizard</span></a>
        </nav>
        <button class="cmd" id="openSearch" type="button"><i class="fa-solid fa-magnifying-glass"></i><span class="grow">Search labels or commands</span><span class="kbd">Ctrl K</span></button>
        <button class="chip-printer" id="printerChip" type="button" title="Printer and settings"><span class="dot off"></span><b>Printer</b><span class="tape"></span></button>
        <a class="btn quiet icon" id="githubLink" href="https://github.com/DL6ER/labelhaus" target="_blank" rel="noopener" title="Source code on GitHub"><i class="fa-brands fa-github"></i></a>
        <button class="btn quiet icon" id="themeToggle" type="button" title="Light or dark"><i class="fa-solid fa-circle-half-stroke"></i></button>
    </header>

    <main id="view"></main>

    <div class="layer" id="layer" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script>const DESIGNER_CONFIG = {{ config|tojson }};</script>
    <script src="{{ url_for('static', filename='designer/designer.js') }}?v={{ version }}"></script>
</body>
</html>

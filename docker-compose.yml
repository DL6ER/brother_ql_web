services:
  labelburg:
    image: ghcr.io/dl6er/labelburg:latest # newest release, see "Image tags" in the README
    # build: . # building locally from source (see git clone below))
    container_name: labelburg
    restart: always
    ports:
      - "8013:8013"
    environment:
      - TZ=Europe/Berlin
      - LABEL_DEFAULT_SIZE=62
      - LABEL_DEFAULT_ORIENTATION=standard
      - PRINTER_MODEL=QL-800
#      - PRINTER_PRINTER=file:///dev/usb/lp0 # only this printer, no detection
    privileged: true # needed to use the USB printers in /dev/usb
    volumes:
      - ./labels:/app/labels
      - /etc/timezone:/etc/timezone:ro
      - /dev/usb:/dev/usb
    network_mode: host # needed for network printer scanning
#    command: >
#      --model QL-800
#      --default-label-size 62
#      file:///dev/usb/lp0

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Labelburg</title>
    <meta name="description" content="{{about}}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eceeef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="Labelburg">
    <meta property="og:description" content="{{tagline}}">
    <link rel="icon" href="app/static/images/app/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="app/static/images/app/apple-touch-icon.png">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <header class="bar">
        <a class="brand" href="#top" aria-label="Labelburg">
            <img src="app/static/images/app/icon.svg" alt="" width="32" height="32">
            <span>Labelburg</span>
        </a>
        <nav>
            <a href="#supported-printers">Printers</a>
            <a href="#features">Features</a>
            <a href="#installation">Install</a>
            <a href="#api">API</a>
            <a href="https://github.com/DL6ER/labelburg">GitHub</a>
        </nav>
    </header>
    <main id="top">
        <section class="hero">
            <img class="mark" src="app/static/images/app/icon.svg" alt="" width="96" height="96">
            <h1>Labelburg</h1>
            <p class="tagline">{{tagline}}</p>
            <div class="actions">
                <a class="btn primary" href="#installation">Install</a>
                <a class="btn" href="https://github.com/DL6ER/labelburg">Source on GitHub</a>
            </div>
            <div class="intro">
{{intro}}
            </div>
        </section>
        <article class="readme">
{{body}}
        </article>
    </main>
    <footer>
        <p>Labelburg is free software under the GPLv3. <a href="https://github.com/DL6ER/labelburg">Source, issues and releases on GitHub</a>.</p>
    </footer>
</body>
</html>

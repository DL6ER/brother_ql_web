# Adds the files of the new versions to Dependabot's pull requests for tools/fonts,
# pushed with a GitHub App's token, as a push with GITHUB_TOKEN starts no tests or
# CodeQL. The App's client ID and key are the Dependabot secrets FONTS_APP_CLIENT_ID and FONTS_APP_KEY.
name: Icon fonts

on:
  pull_request:
    paths:
      - tools/fonts/package-lock.json

permissions: {}

jobs:
  update:
    # On Dependabot's pushes only, not on the one of this job
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.FONTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.FONTS_APP_KEY }}
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Copy the files of the new versions
        run: python tools/update_fonts.py
      - name: Push them to the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          git add app/static
          git diff --cached --quiet && exit 0
          id=$(gh api "users/${APP}%5Bbot%5D" --jq .id)
          git -c user.name="${APP}[bot]" -c user.email="${id}+${APP}[bot]@users.noreply.github.com" \
            commit -m "Add the icon font files of the versions in \`tools/fonts\`"
          git push

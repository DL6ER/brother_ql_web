name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run tests
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            pip install -r requirements-dev.txt
            pytest

  # The label designer in a browser, see tests/browser. Not in the devcontainer:
  # Playwright's Chromium does not run on Alpine.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install fonts and PDF tools
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core poppler-utils
      - name: Install Python packages
        run: pip install -r requirements-browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: pytest tests/browser
